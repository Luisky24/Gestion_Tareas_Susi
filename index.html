<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, shrink-to-fit=no">
  <base target="_top">
  <title>Menú Gestión Tareas</title>
  <style>
    /* Estilos en línea para organizar los botones en columna */
    body {
      background-color: #333;
      color: white;
      display: flex;
      justify-content: center;
      align-items: start;
      min-height: 100vh;
      margin: 20px;
    }

    #opciones {
      display: flex;
      flex-direction: column;
      gap: 10px;
      /* Espaciado entre botones */
      width: 200px;
      /* Ancho uniforme */
    }

    button {
      padding: 10px;
      font-size: 16px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      background-color: #555;
      color: white;
    }

    button:hover {
      background-color: #777;
    }
  </style>
</head>

<body>
  <div id="opciones">
    <button id="altaTarea" onclick="startAction(1)">Nueva Tarea</button>
    <button id="finalizarTarea" onclick="startAction(2)">Finalizar Tarea</button>
    <button id="reactivarTarea" onclick="startAction(3)">Reactivar Tarea</button>
    <button id="borrarTarea" onclick="startAction(4)">Borrar Tarea</button>
    <button id="reorganizarTareas" onclick="startAction(5)">Reorganiza Tareas</button>
    <button id="moverFinalizados" onclick="startAction(6)">Mover Finalizados</button>
    <div id="status" style="margin-up: 20px; margin-bottom: 10px; color: white;">Estado: Listo</div>
  </div>


  <script>
(function(){function e(e){let r=``;try{switch(e){case 1:r=`Nueva Tarea`;break;case 2:r=`Finalizar Tarea`;break;case 3:r=`Reactivar Tarea`;break;case 4:r=`Borrar Tarea`;break;case 5:r=`Reorganizar Tareas`;break;case 6:r=`Traspasar Tareas Finalizadas`;break;default:throw Error(`Opción seleccionada no existe`)}}catch(e){throw Error(e.message)}t(`Inicio proceso... ${r}`),console.log(`start `),n(),google.script.run.withSuccessHandler(e=>t(`Proceso completado.`)).withFailureHandler(e=>t(`Error: ${e.message}`)).gestorOpciones(e)}function t(e){r();let t=document.getElementById(`status`);t.innerText=`Estado: ${e}`,clearTimeout(t.timeout),t.timeout=setTimeout(()=>{t.innerText=`<< Puede seleccionar otra opción >>`},1e4)}function n(){document.querySelectorAll(`#opciones button`).forEach(e=>e.disabled=!0)}function r(){document.querySelectorAll(`#opciones button`).forEach(e=>e.disabled=!1)}(function(){console.log(`Bundle cargado correctamente desde Vite`)})(),window.startAction=e,window.updateStatus=t,window.desactivarBotones=n,window.activarBotones=r,console.log(`Bundle cargado correctamente desde Vite`)})();
</script>
</body>

</html>
